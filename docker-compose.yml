services:
  bot:
    build: .
    container_name: x-video-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Point yt-dlp's PO token plugin at the provider container
      POT_PROVIDER_URL: http://pot-provider:4416
      DB_PATH: /data/bot.db
      LOG_DIR: /data/logs
    volumes:
      - ./data:/data
    depends_on:
      - pot-provider
    # Uncomment to mount a cookies file (set COOKIES_FILE=/data/cookies.txt in .env)
    # volumes:
    #   - ./cookies.txt:/data/cookies.txt:ro

  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-pot-provider
    restart: unless-stopped
    # Not exposed to the host; only the bot container talks to it
